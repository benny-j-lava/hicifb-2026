<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huck It Chuck It Football — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --bg-elev:#FFFFFF;
    --text:#15171B;
    --text-soft:#5B6169;
    --text-muted:#686E76;
    --border:rgba(21,23,27,0.10);
    --border-strong:rgba(21,23,27,0.20);
    --green:#1E7D53; --green-bg:rgba(30,125,83,0.10);
    --amber:#B5490C; --amber-bg:rgba(181,73,12,0.10);
    --blue:#2158B0; --blue-bg:rgba(33,88,176,0.10);
    --violet:#6B3FB5; --violet-bg:rgba(107,63,181,0.10);
    --teal:#0E7A70; --teal-bg:rgba(14,122,112,0.10);
    --gold:#8A6B12; --gold-bg:rgba(154,123,18,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --bg:#15171B;
      --bg-elev:#1D2025;
      --text:#EDEDEB;
      --text-soft:#A0A6AD;
      --text-muted:#8B9299;
      --border:rgba(255,255,255,0.09);
      --border-strong:rgba(255,255,255,0.18);
      --green:#6FCF97; --green-bg:rgba(111,207,151,0.14);
      --amber:#E8875B; --amber-bg:rgba(232,135,91,0.14);
      --blue:#7FB2FF; --blue-bg:rgba(127,178,255,0.14);
      --violet:#B79CE8; --violet-bg:rgba(183,156,232,0.14);
      --teal:#5EEAD4; --teal-bg:rgba(94,234,212,0.14);
      --gold:#E4C368; --gold-bg:rgba(228,195,104,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171B;
    --bg-elev:#1D2025;
    --text:#EDEDEB;
    --text-soft:#A0A6AD;
    --text-muted:#8B9299;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --green:#6FCF97; --green-bg:rgba(111,207,151,0.14);
    --amber:#E8875B; --amber-bg:rgba(232,135,91,0.14);
    --blue:#7FB2FF; --blue-bg:rgba(127,178,255,0.14);
    --violet:#B79CE8; --violet-bg:rgba(183,156,232,0.14);
    --teal:#5EEAD4; --teal-bg:rgba(94,234,212,0.14);
    --gold:#E4C368; --gold-bg:rgba(228,195,104,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;font-weight:600;margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  /* Focus states for keyboard navigation */
  .navbtn:focus-visible, .link-btn:focus-visible, a:focus-visible, button:focus-visible{
    outline:2px solid var(--text);
    outline-offset:2px;
    border-radius:4px;
  }

  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{font-size:clamp(20px,4vw,26px);}
  .header-controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .header-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .theme-toggle{flex-shrink:0;}
  @media (max-width:640px){
    header{flex-direction:column;align-items:stretch;gap:12px;padding:16px 18px 14px;}
    .header-controls{align-items:stretch;}
    .header-status{flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;}
    .header-status .badges{justify-content:flex-start;}
    .header-controls .link-row{justify-content:flex-start;}
  }
  .badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .badge{
    background:var(--gold-bg);
    color:var(--gold);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .badge-neutral{
    background:var(--border);
    color:var(--text-soft);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .badge-warning{
    background:var(--amber-bg);
    color:var(--amber);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .theme-toggle{
    display:flex;
    gap:2px;
    background:var(--border);
    padding:3px;
    border-radius:20px;
  }
  .theme-btn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    border-radius:16px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .theme-btn svg{width:14px;height:14px;}
  .theme-btn.active{background:var(--bg-elev);color:var(--text);}
  .theme-btn:hover:not(.active){color:var(--text-soft);}
  .link-row{display:flex;gap:8px;flex-wrap:wrap;}
  .link-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:20px;
    text-decoration:none;
    cursor:pointer;
  }
  .link-btn:hover{background:var(--bg-elev);}
  .link-btn svg{width:12px;height:12px;flex:0 0 auto;}

  .team-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .team-chip{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    padding:6px 12px;
    border-radius:8px;
  }

  .nav-wrap{position:relative;border-bottom:1px solid var(--border);}
  nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:10px 16px 0;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .nav-fade{
    position:absolute;
    top:0;
    bottom:1px;
    width:28px;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .nav-fade.visible{opacity:1;}
  .nav-fade-left{left:0;background:linear-gradient(90deg, var(--bg) 0%, transparent 100%);}
  .nav-fade-right{right:0;background:linear-gradient(270deg, var(--bg) 0%, transparent 100%);}
  .navbtn{
    flex:0 0 auto;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--text-soft);
    padding:10px 14px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .navbtn.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{max-width:900px;margin:0 auto;padding:24px 18px 70px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade 0.15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  .section-title{font-size:20px;margin-bottom:4px;}
  .section-title.with-accent{border-left:3px solid var(--accent, var(--text));padding-left:12px;}
  .section-sub{color:var(--text-soft);font-size:13.5px;margin:0 0 18px;}

  .subgroup-title{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    font-weight:600;
    margin:24px 0 10px;
  }
  .subgroup-title:first-of-type{margin-top:20px;}

  .card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .card h3{font-size:14px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.04em;font-family:'Inter',sans-serif;font-weight:600;margin-bottom:12px;}

  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:4px;}
  @media (min-width:520px){
    .metric-grid{grid-template-columns:repeat(3,1fr);}
  }
  .metric{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .metric .v{font-family:'Sora',sans-serif;font-size:22px;font-weight:600;display:block;}
  .metric .l{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:4px;align-items:stretch;}
  .feature-card{margin-bottom:0;}
  .feature-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;margin-bottom:8px;}
  .feature-value{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.3;}
  .feature-sub{font-size:12.5px;color:var(--text-soft);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:auto;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
  tr:last-child td{border-bottom:none;}
  @media (max-width:600px){
    table{font-size:12.5px;}
    th{font-size:10px;padding:5px 5px;}
    td{padding:7px 5px;}
  }
  .net-cards{display:none;}
  .net-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    background:var(--bg-elev);
  }
  .net-card:last-child{margin-bottom:0;}
  .net-card-name{font-family:'Sora',sans-serif;font-weight:600;font-size:15px;margin-bottom:8px;}
  .net-card-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--border);}
  .net-card-row:last-child{border-bottom:none;}
  .net-card-row .label{color:var(--text-soft);}
  @media (max-width:560px){
    .net-table-wrap{display:none;}
    .net-cards{display:block;}
  }
  tbody tr{transition:background-color 0.1s ease;}
  tbody tr:hover{background-color:var(--border);}
  .rank-cell{width:34px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .cut-row td{
    padding:4px 8px;
    font-size:10.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    background:var(--bg);
    border-top:1px dashed var(--border-strong);
    border-bottom:1px dashed var(--border-strong);
    text-align:center;
  }
  .cut-row:hover{background-color:transparent;}
  .wheel-row td:first-child{box-shadow:inset 3px 0 0 var(--violet);}
  .wheel-row td{background:var(--violet-bg);}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .empty{color:var(--text-muted);font-size:13.5px;font-style:italic;padding:12px 0;margin:0;}
  .tag-green{background:var(--green-bg);color:var(--green);}
  .tag-amber{background:var(--amber-bg);color:var(--amber);}
  .tag-blue{background:var(--blue-bg);color:var(--blue);}
  .tag-violet{background:var(--violet-bg);color:var(--violet);}
  .tag-teal{background:var(--teal-bg);color:var(--teal);}
  .tag-gold{background:var(--gold-bg);color:var(--gold);}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px;}
  @media (min-width:560px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
  .team-head{margin:16px 0 12px;}
  .team-head-name{font-family:'Sora',sans-serif;font-size:20px;font-weight:600;}
  .team-head-owner{font-size:13px;color:var(--text-soft);margin-top:2px;}
  .select-label{display:block;font-size:12px;color:var(--text-soft);margin:0 0 6px;}
  .team-select{width:100%;max-width:340px;font:inherit;font-size:15px;color:var(--text);background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;}
  .team-select:focus-visible,.team-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--text-soft);}
  .chart-legend .sw{display:inline-block;vertical-align:middle;margin-right:6px;}
  .sw-win,.sw-loss{width:10px;height:10px;border-radius:3px;}
  .sw-win{background:var(--green);}
  .sw-loss{background:var(--text-muted);opacity:.55;}
  .sw-line{width:16px;height:0;border-top:2px dashed var(--gold);}
  .team-link{color:inherit;text-decoration:underline dotted var(--text-muted);text-underline-offset:3px;}
  tr.selected-row td{font-weight:600;}
  td.pos{color:var(--green);}
  td.neg{color:var(--amber);}
  .tag-gray{background:var(--border);color:var(--text-soft);}

  .loading{padding:70px 20px;text-align:center;color:var(--text-soft);}
  .spinner{
    width:26px;height:26px;
    border:3px solid var(--border-strong);
    border-top-color:var(--text-soft);
    border-radius:50%;
    margin:0 auto 14px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-msg{padding:60px 20px;text-align:center;}
  .error-msg p{color:var(--amber);margin:0 0 14px;}

  .lead-name{font-family:'Sora',sans-serif;font-weight:600;}
  .accent-green{color:var(--green);}
  .accent-amber{color:var(--amber);}
  .accent-blue{color:var(--blue);}
  .accent-violet{color:var(--violet);}
  .accent-teal{color:var(--teal);}
  .accent-gold{color:var(--gold);}
</style>
</head>
<body>

<header>
  <h1>Huck It Chuck It Football</h1>
  <div class="header-controls">
    <div class="header-status">
      <div class="badges" id="header-badges">
        <span class="badge-neutral">Loading…</span>
      </div>
      <div class="theme-toggle" id="theme-toggle"></div>
    </div>
    <div class="link-row">
      <a class="link-btn" href="https://football.fantasysports.yahoo.com/f1/916694" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        Yahoo league
      </a>
      <a class="link-btn" href="https://drive.google.com/file/d/11PVaaci91UFUF4hIhSQbyyXEigXacpQV/view?usp=sharing" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        League rules
      </a>
    </div>
  </div>
</header>

<div class="nav-wrap">
  <nav id="tabs"></nav>
  <div class="nav-fade nav-fade-left" id="nav-fade-left"></div>
  <div class="nav-fade nav-fade-right" id="nav-fade-right"></div>
</div>
<main id="main"><div class="loading"><div class="spinner"></div><p>Loading league data…</p></div></main>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWtG0XWPUbC7nZpgRDntfXKofSJaysxnKWcYgoAjcAiBOg-CUFexBDH7ZdwI1Xa9Y/exec";

const TABS = [
  {id:'overview', label:'Overview', accent:'--text'},
  {id:'payouts', label:'Payouts', accent:'--green'},
  {id:'talbot', label:'Talbot toll', accent:'--amber'},
  {id:'survivor', label:'Survivor', accent:'--blue'},
  {id:'wheel', label:'Wheel', accent:'--violet'},
  {id:'charity', label:'Charity', accent:'--teal'},
  {id:'standings', label:'Standings', accent:'--gold'},
  {id:'teams', label:'Teams', accent:'--text'}
];

let DATA = null;
let activeTab = 'overview';
let themeMode = 'system'; // 'system' | 'light' | 'dark'
let selectedTeamId = null; // which team the Teams tab is showing
let lastChartW = 0;
let resizeTimer = null;

const THEME_ICONS = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
};

function applyTheme(){
  if(themeMode === 'system'){
    document.documentElement.removeAttribute('data-theme');
  }else{
    document.documentElement.setAttribute('data-theme', themeMode);
  }
  renderThemeToggle();
}

function renderThemeToggle(){
  const el = document.getElementById('theme-toggle');
  if(!el) return;
  el.innerHTML = ['light','system','dark'].map(mode=>
    `<button class="theme-btn${themeMode===mode?' active':''}" data-mode="${mode}" aria-label="${mode} mode" title="${mode.charAt(0).toUpperCase()+mode.slice(1)} mode">${THEME_ICONS[mode]}</button>`
  ).join('');
  el.querySelectorAll('.theme-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ themeMode = b.dataset.mode; applyTheme(); });
  });
}

applyTheme();

function fmt(n){
  const num = Number(n);
  if(isNaN(num)) return '$0';
  return '$' + Math.round(num).toLocaleString();
}
function pts(n){
  const num = Number(n);
  if(isNaN(num)) return '0.0';
  return num.toFixed(1);
}
function fmtSigned(n){
  const num = Math.round(Number(n)||0);
  const sign = num < 0 ? '-' : '+';
  return sign + '$' + Math.abs(num).toLocaleString();
}
function formatTiedNames(names){
  if(names.length <= 2) return names.join(' & ');
  return `${names.length} teams tied`;
}

async function load(){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('Request failed');
    DATA = await res.json();
    cleanData();
    renderHeader();
    renderTabs();
    renderMain();
  }catch(e){
    document.getElementById('main').innerHTML = `
      <div class="error-msg">
        <p>Could not load league data right now.</p>
        <button class="link-btn" onclick="location.reload()">Try again</button>
      </div>
    `;
    document.getElementById('header-badges').innerHTML = '';
  }
}

function cleanData(){
  if(DATA.teamTotals){
    DATA.teamTotals = DATA.teamTotals.filter(r => /^t\d+$/.test(r.TeamID));
  }
  if(DATA.standings){
    DATA.standings = DATA.standings.filter(r => r.Place !== '' && r.Place !== undefined && r.Place !== null);
  }
}

function teamName(id){
  const t = (DATA.teams||[]).find(x=>x.TeamID===id);
  return t ? t.TeamName : (id || '—');
}

// Week 1 begins the Tuesday before the 2026 season's Wednesday opener (Sep 9).
// Each subsequent week is a standard Tuesday-to-Monday NFL week. Weeks 1-14 are
// the regular season for this league; weeks 15-17 are the 3-round playoffs.
const SEASON_WEEK1_START = new Date(2026, 8, 8); // Sep 8, 2026 (month is 0-indexed)
const REGULAR_SEASON_WEEKS = 14;
const LAST_WEEK = 17;

function getCurrentWeekInfo(){
  const now = new Date();
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  let weekNum = Math.floor((now - SEASON_WEEK1_START) / msPerWeek) + 1;
  if(weekNum < 1) weekNum = 1;
  if(weekNum > LAST_WEEK) weekNum = LAST_WEEK;
  const isPlayoffs = weekNum > REGULAR_SEASON_WEEKS;
  return { week: weekNum, isPlayoffs };
}

function getLatestLoggedWeek(){
  const weeks = (DATA.weeklyScores||[]).map(r=>Number(r.Week)).filter(n=>!isNaN(n));
  return weeks.length ? Math.max(...weeks) : 0;
}

// "Stale" means the Sheet is missing at least one full week of scores relative
// to the calendar -- being one week behind is normal (this week isn't over yet).
function getDataFreshness(){
  const wk = getCurrentWeekInfo();
  const latestLogged = getLatestLoggedWeek();
  const weeksBehind = wk.week - latestLogged;
  return { ...wk, latestLogged, weeksBehind, isStale: weeksBehind >= 2 };
}

function renderHeader(){
  const d = DATA.dashboard || {};
  const fresh = getDataFreshness();
  const weekLabel = fresh.isPlayoffs ? `Playoffs · Wk ${fresh.week}` : `Week ${fresh.week}`;
  document.getElementById('header-badges').innerHTML = `
    <span class="badge-neutral">${weekLabel}</span>
    ${fresh.isStale ? `<span class="badge-warning">Data from Wk ${fresh.latestLogged}</span>` : ''}
    <span class="badge">Pot ${fmt(d.totalPot)}</span>
    <span class="badge">Charity ${fmt(d.charityRaised)}</span>
  `;
}

function updateNavFades(){
  const el = document.getElementById('tabs');
  const left = document.getElementById('nav-fade-left');
  const right = document.getElementById('nav-fade-right');
  if(!el || !left || !right) return;
  const maxScroll = el.scrollWidth - el.clientWidth;
  left.classList.toggle('visible', el.scrollLeft > 4);
  right.classList.toggle('visible', el.scrollLeft < maxScroll - 4);
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t=>`<button class="navbtn${t.id===activeTab?' active':''}" data-tab="${t.id}" style="--accent:var(${t.accent})">${t.label}</button>`).join('');
  el.querySelectorAll('.navbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeTab=b.dataset.tab;
      renderTabs();
      renderMain();
    });
  });
  el.removeEventListener('scroll', updateNavFades);
  el.addEventListener('scroll', updateNavFades);
  // Keep the active tab in view, and let layout settle before measuring fades.
  const activeBtn = el.querySelector('.navbtn.active');
  if(activeBtn) activeBtn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  setTimeout(updateNavFades, 0);
}
window.addEventListener('resize', updateNavFades);

function renderMain(){
  const el = document.getElementById('main');
  const renderers = {
    overview: renderOverview, payouts: renderPayouts, talbot: renderTalbot,
    survivor: renderSurvivor, wheel: renderWheel, charity: renderCharity,
    standings: renderStandings, teams: renderTeams
  };
  el.innerHTML = renderers[activeTab]();
  el.querySelectorAll('.goto-standings').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      activeTab = 'standings';
      renderTabs();
      renderMain();
      window.scrollTo({ top: 0 });
    });
  });
  // Any team name rendered as a .team-link opens that team's page.
  el.querySelectorAll('.team-link').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      selectTeam(a.dataset.team);
    });
  });
  const teamSelect = el.querySelector('#team-select');
  if(teamSelect){
    teamSelect.addEventListener('change', ()=>{
      selectedTeamId = teamSelect.value;
      renderMain();
    });
  }
}

function selectTeam(id){
  selectedTeamId = id;
  activeTab = 'teams';
  renderTabs();
  renderMain();
  window.scrollTo({ top: 0 });
}

// The chart is drawn at the container's real pixel width so its text stays a readable
// size on phones; redraw if the width actually changes (rotation, window resize).

// Consistent title helper: category-colored left accent, used on every tab except Overview/Teams.
function titleWithAccent(text, cssVar){
  return `<h2 class="section-title with-accent" style="--accent:var(${cssVar});">${text}</h2>`;
}

// ---------- OVERVIEW ----------
// Single source of truth for standings: best record first, total points as the
// tiebreaker. Used by both the Team records table and the Wheel watch card.
function rankTeams(){
  const gamesByTeam = {};
  (DATA.weeklyScores||[]).forEach(row=>{
    gamesByTeam[row.TeamID] = (gamesByTeam[row.TeamID]||0) + 1;
  });
  return (DATA.teamTotals||[]).filter(t=>t.TeamID).map(t=>{
    const wins = Number(t.WeeksWon||0);
    const played = gamesByTeam[t.TeamID] || 0;
    return { ...t, wins, losses: Math.max(played - wins, 0), points: Number(t.SeasonTotalPoints||0) };
  }).sort((a,b)=> b.wins - a.wins || b.points - a.points);
}

// Average points per game for whoever currently leads the season-long Highest Score race.
function computeLeaderAverage(){
  const d = DATA.dashboard || {};
  const leader = (DATA.teamTotals||[]).find(t=>t.TeamName===d.highScoreLeader);
  if(!leader) return null;
  const games = (DATA.weeklyScores||[]).filter(r=>r.TeamID===leader.TeamID && r.Score!=='' && r.Score!==null && r.Score!==undefined).length;
  if(!games) return null;
  return { games, avg: Number(d.highScoreTotal||0) / games };
}

function computeLastPlace(){
  const ranked = rankTeams();
  if(!ranked.length) return null;
  const last = ranked[ranked.length-1];
  // Only a true tie (same wins AND same points) counts as sharing last place.
  const tied = ranked.filter(t=>t.wins===last.wins && t.points===last.points);
  return { wins: last.wins, losses: last.losses, points: last.points, teams: tied.map(t=>teamName(t.TeamID)) };
}

function computeNetEarnings(){
  const totals = (DATA.teamTotals||[]).filter(t=>t.TeamID);
  if(!totals.length) return [];

  const talbotByTeam = {};
  (DATA.talbotToll||[]).forEach(f=>{
    talbotByTeam[f.TeamID] = (talbotByTeam[f.TeamID]||0) + Number(f.Amount||0);
  });

  const standingsByTeam = {};
  (DATA.standings||[]).forEach(s=>{
    if(s.TeamID && s.Payout) standingsByTeam[s.TeamID] = (standingsByTeam[s.TeamID]||0) + Number(s.Payout||0);
  });

  const d = DATA.dashboard || {};
  const seasonConcluded = (DATA.standings||[]).some(s => s.TeamID);
  const highScoreTeam = (DATA.teams||[]).find(t=>t.TeamName===d.highScoreLeader);
  const survivorTeam = (DATA.teams||[]).find(t=>t.TeamName===d.survivorWinner);
  const wheel = DATA.wheel || {};
  const spin = wheel.spinResult || {};
  const buyDownTotal = (wheel.punishments||[]).filter(p=>p.BoughtDown==='Yes').reduce((s,p)=>s+Number(p.BuyDownCost||0),0);
  const buyoutTotal = spin.buyoutUsed === 'Yes' ? 150 : 0;

  return totals.map(t=>{
    const earned = Number(t.WeeklyPayoutEarned||0)
      + (seasonConcluded && highScoreTeam && t.TeamID===highScoreTeam.TeamID ? 25 : 0)
      + (survivorTeam && t.TeamID===survivorTeam.TeamID ? 25 : 0)
      + (standingsByTeam[t.TeamID] || 0);
    const spent = 150
      + (talbotByTeam[t.TeamID] || 0)
      + (t.TeamID === spin.teamId ? (buyDownTotal + buyoutTotal) : 0);
    const paid = Number(t.AmountPaid || 0);
    const owed = Math.max(earned - paid, 0);
    return { teamId: t.TeamID, name: teamName(t.TeamID), earned, spent, net: earned - spent, paid, owed };
  });
}

  return `

  <div class="metric-grid">

    <div class="metric"><span class="v accent-teal">${fmt(d.charityRaised)}</span><span class="l">Charity raised</span></div>

  </div>

  <div class="subgroup-title">Points race</div>
  <div class="feature-grid">
    <div class="card feature-card">
      <div class="feature-label">Highest score race</div>
      ${hasScores
        ? `<div class="feature-value">${d.highScoreLeader}</div><div class="feature-sub">${pts(d.highScoreTotal)} points this season</div>${leaderAvg ? `<div class="feature-sub">${pts(leaderAvg.avg)} avg per game over ${leaderAvg.games} ${leaderAvg.games===1?'week':'weeks'}</div>` : ''}`
        : `<p class="empty">No scores logged yet.</p>`}
    </div>
    <div class="card feature-card">

      ${lastPlace
        ? `<div class="feature-value">${formatTiedNames(lastPlace.teams)}</div><div class="feature-sub">${lastPlace.wins}-${lastPlace.losses}, ${pts(lastPlace.points)} points — currently ${lastPlace.teams.length>1?'tied for ':''}last in the standings</div><div class="feature-sub"><a href="#" class="goto-standings" style="color:var(--violet);">See full standings</a></div>`
        : `<p class="empty">No scores logged yet.</p>`}
    </div>
  </div>

  <div class="subgroup-title">Money</div>
  <div class="card">
    <h3>Net earnings</h3>
    ${hasNetSpread ? `
      <div style="display:flex;gap:24px;flex-wrap:wrap;">
        <div>
          <div class="feature-label" style="color:var(--green);">Highest</div>
          <div class="feature-value">${formatTiedNames(bestNetTeams)}</div>

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text){
  if(!text) return '';
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s]+)/g, url => {
    const clean = url.replace(/[.,;:)]+$/, '');
    const trailing = url.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener" style="color:var(--violet);">${clean}</a>${trailing}`;
  });
}

// ---------- STANDINGS ----------
const BYE_SPOTS = 2;       // top 2 teams skip the first playoff round
const PLAYOFF_SPOTS = 6;   // 6-team championship bracket

function renderStandings(){
  const ranked = rankTeams();
  const hasScores = (DATA.weeklyScores||[]).length > 0;
  const last = ranked.length ? ranked[ranked.length-1] : null;
  const bodyRows = [];

  ranked.forEach((t, i)=>{
    const inWheelZone = last && t.wins===last.wins && t.points===last.points;
    bodyRows.push(`
    <tr${inWheelZone ? ' class="wheel-row"' : ''}>
      <td class="rank-cell">${i+1}</td>
      <td><a href="#" class="team-link" data-team="${t.TeamID}">${escapeHtml(teamName(t.TeamID))}</a>${inWheelZone ? ' <span class="pill tag-violet">Wheel zone</span>' : ''}</td>
      <td class="num-cell">${t.wins}-${t.losses}</td>
      <td class="num-cell">${pts(t.points)}</td>
      <td class="num-cell">${fmt(t.WeeklyPayoutEarned)}</td>
    </tr>`);
    if(ranked.length > PLAYOFF_SPOTS){
      if(i === BYE_SPOTS-1) bodyRows.push(`<tr class="cut-row"><td colspan="5">First-round bye line</td></tr>`);
      if(i === PLAYOFF_SPOTS-1) bodyRows.push(`<tr class="cut-row"><td colspan="5">Playoff line</td></tr>`);
    }
  });

  // Final payouts only appear once the commissioner has filled in the placings.
  const finalsSet = (DATA.standings||[]).some(s => s.TeamID);
  const finalRows = (DATA.standings||[]).map(s=>`
    <tr>
      <td>${s.Place}</td>
      <td>${s.TeamID ? teamName(s.TeamID) : (s.TeamName || '—')}</td>
      <td class="num-cell">${fmt(s.Payout)}</td>
    </tr>
  `).join('');

  return `
  ${titleWithAccent('Standings', '--gold')}
  <p class="section-sub">Ranked by record, with total points as the tiebreaker. These standings may be outdated and could differ slightly from Yahoo, which is the source of truth. <a href="https://football.fantasysports.yahoo.com/f1/916694" target="_blank" rel="noopener" style="color:var(--gold);">Open Yahoo league</a></p>

  <div class="card">
    ${hasScores && ranked.length ? `<table><thead><tr><th class="rank-cell">#</th><th>Team</th><th class="num-cell">Record</th><th class="num-cell">Points</th><th class="num-cell">Earned</th></tr></thead><tbody>${bodyRows.join('')}</tbody></table>`
      : `<p class="empty">Standings will show up once Week 1 scores are in.</p>`}
  </div>

  <div class="card">
    <h3>Final payouts</h3>
    ${finalsSet && finalRows ? `<table><thead><tr><th>Place</th><th>Team</th><th class="num-cell">Payout</th></tr></thead><tbody>${finalRows}</tbody></table>`
      : `<p class="empty">Set once the championship wraps.</p>`}
  </div>
  `;
}

// ---------- TEAMS ----------
function isWin(row){ return row.Won === 'Yes' || row.Won === true; }

function median(nums){
  const a = nums.slice().sort((x,y)=>x-y);
  if(!a.length) return 0;
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}

// Per-week league context: every score, the median, and whether the week's
// results are in yet (at least one team has been marked a winner).
function getWeeklyLeague(){
  const byWeek = {};
  (DATA.weeklyScores||[]).forEach(r=>{
    const w = Number(r.Week), sc = Number(r.Score);
    if(!w || isNaN(sc)) return;
    (byWeek[w] = byWeek[w] || {scores:[], decided:false});
    byWeek[w].scores.push(sc);
    if(isWin(r)) byWeek[w].decided = true;
  });
  Object.keys(byWeek).forEach(w=>{ byWeek[w].median = median(byWeek[w].scores); });
  return byWeek;
}

function getChartWidth(){
  const m = document.getElementById('main');
  const w = m && m.clientWidth ? m.clientWidth - 74 : 340;
  return Math.max(260, Math.min(840, w));
}

function niceStep(max){ return max <= 100 ? 25 : max <= 250 ? 50 : 100; }

function buildTeamChart(teamId, league){
  const rows = (DATA.weeklyScores||[])
    .filter(r=>r.TeamID===teamId && Number(r.Week) && !isNaN(Number(r.Score)))
    .sort((a,b)=>Number(a.Week)-Number(b.Week));
  if(!rows.length) return '';
  const W = getChartWidth(); lastChartW = W;
  const H = 250, ml = 34, mr = 8, mt = 16, mb = 24;
  const pw = W - ml - mr, ph = H - mt - mb;
  const medians = rows.map(r=>league[Number(r.Week)].median);
  const maxVal = Math.max(...rows.map(r=>Number(r.Score)), ...medians, 1);
  const step = niceStep(maxVal);
  const top = Math.ceil(maxVal / step) * step;
  const y = v => mt + ph - (v / top) * ph;
  const slot = pw / rows.length;
  const bw = Math.max(4, Math.min(34, slot * 0.62));
  let g = '';
  for(let v = 0; v <= top; v += step){
    g += `<line x1="${ml}" x2="${W-mr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    g += `<text x="${ml-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${v}</text>`;
  }
  let bars = '', labels = '', pts_ = [], dots = '';
  rows.forEach((r,i)=>{
    const wk = Number(r.Week), sc = Number(r.Score), lg = league[wk];
    const cx = ml + slot*i + slot/2;
    const win = isWin(r);
    const fill = win ? 'var(--green)' : 'var(--text-muted)';
    const op = win ? 1 : (lg.decided ? 0.55 : 0.4);
    const bh = (sc / top) * ph;
    const status = win ? 'Win' : (lg.decided ? 'Loss' : 'Pending');
    bars += `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(sc).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${fill}" opacity="${op}"><title>Week ${wk}: ${sc.toFixed(1)} (${status}), league median ${lg.median.toFixed(1)}</title></rect>`;
    if(slot >= 28) labels += `<text x="${cx.toFixed(1)}" y="${(y(sc)-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-soft)">${Math.round(sc)}</text>`;
    if(slot >= 14 || i % 2 === 0) labels += `<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${wk}</text>`;
    pts_.push(`${cx.toFixed(1)},${y(lg.median).toFixed(1)}`);
    dots += `<circle cx="${cx.toFixed(1)}" cy="${y(lg.median).toFixed(1)}" r="3" fill="var(--bg-elev)" stroke="var(--gold)" stroke-width="1.5"/>`;
  });
  const line = pts_.length > 1 ? `<polyline points="${pts_.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 3"/>` : '';
  const aria = `Weekly scores for ${teamName(teamId)} compared with the league median`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${escapeHtml(aria)}" style="display:block;max-width:${W}px;">${g}${bars}${line}${dots}${labels}</svg>`;
}

function renderTeams(){
  const teams = DATA.teams || [];
  if(!teams.length) return `<h2 class="section-title">Teams</h2><p class="empty">No teams yet.</p>`;
  if(!selectedTeamId || !teams.some(t=>t.TeamID===selectedTeamId)) selectedTeamId = teams[0].TeamID;
  const team = teams.find(t=>t.TeamID===selectedTeamId);
  const ranked = rankTeams();
  const league = getWeeklyLeague();
  const rankIdx = ranked.findIndex(t=>t.TeamID===selectedTeamId);
  const rt = rankIdx >= 0 ? ranked[rankIdx] : null;
  const mine = (DATA.weeklyScores||[])
    .filter(r=>r.TeamID===selectedTeamId && Number(r.Week) && !isNaN(Number(r.Score)))
    .sort((a,b)=>Number(a.Week)-Number(b.Week));
  const hasScores = (DATA.weeklyScores||[]).length > 0;

  const options = teams.map(t=>`<option value="${escapeHtml(t.TeamID)}"${t.TeamID===selectedTeamId?' selected':''}>${escapeHtml(t.TeamName)}</option>`).join('');

  let aboveCount = 0;
  const tableRows = mine.map(r=>{
    const wk = Number(r.Week), sc = Number(r.Score), lg = league[wk];
    const diff = sc - lg.median;
    if(diff > 0) aboveCount++;
    const win = isWin(r);
    const pill = win ? '<span class="pill tag-green">Win</span>' : (lg.decided ? '<span class="pill tag-gray">Loss</span>' : '—');
    const diffCls = diff > 0 ? 'pos' : diff < 0 ? 'neg' : '';
    const diffTxt = (diff > 0 ? '+' : diff < 0 ? '−' : '') + Math.abs(diff).toFixed(1);
    return `<tr><td>${wk}</td><td class="num-cell">${pts(sc)}</td><td class="num-cell">${pts(lg.median)}</td><td class="num-cell ${diffCls}">${diffTxt}</td><td class="num-cell">${pill}</td></tr>`;
  }).join('');

  const played = mine.length;
  const totalPts = mine.reduce((a,r)=>a+Number(r.Score),0);
  const stats = `
    <div class="stat-grid">
      <div class="metric"><span class="v">${rt && hasScores ? '#'+(rankIdx+1) : '—'}</span><div class="l">Standing${rt && hasScores ? ' of '+ranked.length : ''}</div></div>
      <div class="metric"><span class="v">${rt && played ? rt.wins+'-'+rt.losses : '—'}</span><div class="l">Record</div></div>
      <div class="metric"><span class="v">${played ? pts(totalPts/played) : '—'}</span><div class="l">Avg per game</div></div>
      <div class="metric"><span class="v">${played ? aboveCount+' of '+played : '—'}</span><div class="l">Weeks above median</div></div>
    </div>`;

  const chart = played ? `
    <div class="card">
      <h3>Week by week</h3>
      ${buildTeamChart(selectedTeamId, league)}
      <div class="chart-legend">
        <span><i class="sw sw-win"></i>Win</span>
        <span><i class="sw sw-loss"></i>Loss</span>
        <span><i class="sw sw-line"></i>League median</span>
      </div>
    </div>
    <div class="card">
      <table><thead><tr><th>Week</th><th class="num-cell">Score</th><th class="num-cell">Median</th><th class="num-cell">vs median</th><th class="num-cell">Result</th></tr></thead><tbody>${tableRows}</tbody></table>
    </div>` : `<div class="card"><p class="empty">Weekly scores will show up once Week 1 is in.</p></div>`;

  const rosterRows = teams.map(t=>{
    const r = ranked.find(x=>x.TeamID===t.TeamID);
    const rec = r && hasScores ? `${r.wins}-${r.losses}` : '—';
    return `<tr${t.TeamID===selectedTeamId?' class="selected-row"':''}><td><a href="#" class="team-link" data-team="${escapeHtml(t.TeamID)}">${escapeHtml(t.TeamName)}</a></td><td>${escapeHtml(t.Owner || '—')}</td><td class="num-cell">${rec}</td></tr>`;
  }).join('');

  return `
  <h2 class="section-title">Teams</h2>
  <p class="section-sub">Pick a team to see how it has scored week by week against the league median.</p>
  <label class="select-label" for="team-select">Team</label>
  <select id="team-select" class="team-select">${options}</select>
  <div class="team-head"><div class="team-head-name">${escapeHtml(team.TeamName)}</div><div class="team-head-owner">${escapeHtml(team.Owner || '')}</div></div>
  ${stats}
  ${chart}
  <div class="card">
    <h3>All teams</h3>
    <table><thead><tr><th>Team</th><th>Owner</th><th class="num-cell">Record</th></tr></thead><tbody>${rosterRows}</tbody></table>
  </div>
  `;
}

load();
</script>
