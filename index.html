<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huck It Chuck It Football · 2026</title>
<meta name="description" content="Huck It Chuck It Football: standings, payouts, Survivor, and the Wheel of Misfortune.">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315171B'/%3E%3Cellipse cx='32' cy='32' rx='20' ry='12' transform='rotate(-35 32 32)' fill='%23E4C368'/%3E%3Cpath d='M22 38l20-12' stroke='%2315171B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root{
  --bg:light-dark(#F5F5F2,#111316);
  --surface:light-dark(#FFFFFF,#1A1D22);
  --surface-2:light-dark(#EDEDE8,#242830);
  --ink:light-dark(#14161A,#F0F0EC);
  --ink-2:light-dark(#4B515A,#AEB4BC);
  --ink-3:light-dark(#656B74,#8E959D);
  --line:light-dark(rgba(20,22,26,.10),rgba(255,255,255,.10));
  --line-2:light-dark(rgba(20,22,26,.20),rgba(255,255,255,.20));
  --green:light-dark(#17724A,#6FCF97);
  --amber:light-dark(#B04A0A,#F0956B);
  --blue:light-dark(#2158B0,#8DB9FF);
  --violet:light-dark(#6B3FB5,#BEA6EE);
  --teal:light-dark(#0E7A70,#5EEAD4);
  --gold:light-dark(#8A6B12,#E4C368);
  --r:14px;
  --nav-h:62px;
  --display:'Sora',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* ---------- App shell ---------- */
.app{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font:700 15px/1.1 var(--display);letter-spacing:-.01em;text-decoration:none;display:flex;flex-direction:column;gap:2px}
.brand small{font:500 11px/1 'Inter';color:var(--ink-3);letter-spacing:.02em}
.top .brand{flex:1;min-width:0}
.ctls{display:flex;align-items:center;gap:8px}
.ctl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;max-width:190px;font-weight:600;font-size:13px}
.ctl.empty{padding:7px 14px}
.ctl-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon-btn svg{width:17px;height:17px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--ink)}
.side{display:contents}
.side .brand,.side .side-foot{display:none}
main{width:100%;max-width:820px;margin:0 auto;padding:20px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));outline:none}
@media (min-width:900px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .top{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh;padding:26px 16px 20px;border-right:1px solid var(--line)}
  .side .brand,.side .side-foot{display:flex}
  .side .brand{font-size:18px;padding:0 10px}
  .nav{position:static;flex-direction:column;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:2px}
  .nav a{flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;border-radius:10px;color:var(--ink-2)}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .side-foot{margin-top:auto;flex-direction:column;gap:12px}
  .side-foot .ctls{flex-direction:column;align-items:stretch}
  .side-foot .ctl{max-width:none}
  .side-foot .icon-btn{align-self:flex-start}
  .side-links{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-3);padding:0 4px}
  main{padding:40px 44px 72px}
}

/* ---------- Type & primitives ---------- */
.pagehead{margin-bottom:20px}
.pagehead h1{font:700 clamp(26px,5.5vw,34px)/1.1 var(--display);letter-spacing:-.025em}
.pagehead p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-3);text-decoration:none;margin-bottom:12px}
.back:hover{color:var(--ink)}
.sec{margin-top:28px}
.sec>h2,.sec-h{font:600 11.5px/1 'Inter';text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.kicker{font:600 11.5px/1 'Inter';text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.big{font:700 clamp(28px,7vw,40px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font:600 20px/1.15 var(--display);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.soft{color:var(--ink-2)}
.muted{color:var(--ink-3)}
.sm{font-size:13px}
.quip{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.pill{--c:var(--ink-2);--t:var(--surface-2);display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 'Inter';padding:5px 9px;border-radius:99px;background:var(--t);color:var(--c);white-space:nowrap}
.p-green{--c:var(--green);--t:color-mix(in srgb,var(--green) 14%,transparent)}
.p-amber{--c:var(--amber);--t:color-mix(in srgb,var(--amber) 14%,transparent)}
.p-blue{--c:var(--blue);--t:color-mix(in srgb,var(--blue) 14%,transparent)}
.p-violet{--c:var(--violet);--t:color-mix(in srgb,var(--violet) 14%,transparent)}
.p-gold{--c:var(--gold);--t:color-mix(in srgb,var(--gold) 16%,transparent)}
.p-teal{--c:var(--teal);--t:color-mix(in srgb,var(--teal) 14%,transparent)}
.pos{color:var(--green)}.neg{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.stats.s4{grid-template-columns:repeat(4,minmax(0,1fr))}.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font:700 24px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:4px;display:block}
.pair{display:grid;gap:12px}
@media (min-width:620px){.pair{grid-template-columns:1fr 1fr}.pair .card+.card{margin-top:0}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:16px;background:color-mix(in srgb,var(--amber) 12%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.banner b{color:var(--amber)}
.empty{color:var(--ink-3);font-size:14px;margin:0;padding:6px 0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.progress-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}

/* Avatars */
.av{--h:200;width:32px;height:32px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font:700 12px/1 var(--display);letter-spacing:.01em;background:hsl(var(--h) 55% 50% / .2);color:light-dark(hsl(var(--h) 65% 26%),hsl(var(--h) 75% 80%))}
.av.sm{width:28px;height:28px;border-radius:99px;font-size:11px}
.av.lg{width:56px;height:56px;border-radius:16px;font-size:19px}

/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.row:last-child{border-bottom:0}
a.row:hover .row-name{text-decoration:underline;text-underline-offset:3px}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row-end{text-align:right;flex:0 0 auto}
.row.me{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:10px;padding-left:10px;padding-right:10px;margin:2px -8px;border-bottom-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:500;text-decoration:none}
.chip .av{width:22px;height:22px;border-radius:99px;font-size:9px}
.chip.out{opacity:.55;text-decoration:line-through}
a.chip:hover{background:var(--line-2)}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px/1 'Inter';text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td.rk{width:34px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tn{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.tn:hover span{text-decoration:underline;text-underline-offset:3px}
tr.me td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
tr.wheel td{background:color-mix(in srgb,var(--violet) 10%,transparent)}
tr.wheel td:first-child{box-shadow:inset 3px 0 0 var(--violet)}
tr.cut td{padding:4px 8px;font:600 10.5px/1.2 'Inter';text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:center;background:var(--bg);border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2)}
@media (max-width:480px){.hide-xs{display:none}}

/* Segmented control */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:1 0 auto;text-align:center;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}

/* Team hero */
.hero{padding:18px}
.hero-top{display:flex;gap:14px;align-items:center}
.hero-name{font:700 clamp(19px,4.6vw,24px)/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.hero-owner{font-size:13px;color:var(--ink-3)}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
@media (min-width:620px){.hero-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hero-stats .l{font-size:12px;color:var(--ink-3);margin-top:5px;display:block}
.hero .chips{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:9px 14px;border-radius:99px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid:hover{opacity:.9;background:var(--ink)}
.prompt{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Chart */
.chart-host{width:100%;min-height:230px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg-win,.lg-loss{width:10px;height:10px;border-radius:3px}
.lg-win{background:var(--green)}.lg-loss{background:var(--ink-3);opacity:.5}
.lg-med{width:16px;border-top:2px dashed var(--gold)}

/* Wheel */
.wheel-wrap{display:grid;gap:18px;align-items:center}
@media (min-width:700px){.wheel-wrap{grid-template-columns:280px 1fr}}
.wheel-svg{width:100%;max-width:300px;margin:0 auto;display:block}
.slot-n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px/1 var(--display);background:var(--surface-2);flex:0 0 auto}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:20px;width:min(440px,calc(100vw - 24px));max-height:min(640px,calc(100dvh - 32px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,15,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{padding:20px;display:flex;flex-direction:column;max-height:inherit}
.sheet h2{font:700 21px/1.15 var(--display);letter-spacing:-.02em}
.sheet p{margin:6px 0 14px;color:var(--ink-2);font-size:14px}
.pick-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;margin:0 -6px;padding:0 6px 4px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;cursor:pointer;width:100%}
.pick:hover{border-color:var(--line-2)}
.pick.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.pick b{display:block;font-weight:600;font-size:14px}
.pick small{color:var(--ink-3);font-size:12.5px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* Skeleton */
.sk{border-radius:10px;background:var(--surface-2);min-height:16px}
@media (prefers-reduced-motion:no-preference){
  .sk{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  main>*{animation:rise .22s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
footer.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:6px 16px;flex-wrap:wrap}
footer.foot a{color:var(--ink-2)}
.error{text-align:center;padding:60px 10px}
.error p{color:var(--amber);margin:0 0 14px}
</style>
</head>

<script>
"use strict";
/* ============================================================
   Huck It Chuck It Football — front end
   Data source is unchanged: the Apps Script feed below.
   ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWtG0XWPUbC7nZpgRDntfXKofSJaysxnKWcYgoAjcAiBOg-CUFexBDH7ZdwI1Xa9Y/exec";
const YAHOO_URL = "https://football.fantasysports.yahoo.com/f1/916694";
const RULES_URL = "https://drive.google.com/file/d/11PVaaci91UFUF4hIhSQbyyXEigXacpQV/view?usp=sharing";

// Season calendar (unchanged logic from the previous site)
const SEASON_WEEK1_START = new Date(2026, 8, 8);
const REGULAR_SEASON_WEEKS = 14;
const LAST_WEEK = 17;
const SURVIVOR_END_WEEK = 10;
const BYE_SPOTS = 2, PLAYOFF_SPOTS = 6;

const KEY = { data:'hicic:data:v2', team:'hicic:myteam', skip:'hicic:skip', theme:'hicic:theme' };
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let DATA = null, M = null, fetchedAt = null, fromCache = false, loadFailed = false;
let myTeamId = store.get(KEY.team) || null;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => { const v = Math.round(Number(n)||0); return (v<0?'−':'') + '$' + Math.abs(v).toLocaleString('en-US'); };
const signed = n => { const v = Math.round(Number(n)||0); return (v<0?'−':v>0?'+':'') + '$' + Math.abs(v).toLocaleString('en-US'); };
const pts = n => (Number(n)||0).toFixed(1);
const isWin = r => r.Won === 'Yes' || r.Won === true;
const hasNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));
function slugify(s){ return String(s).toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'team'; }
function median(nums){ const a = nums.slice().sort((x,y)=>x-y); if(!a.length) return 0; const m = Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
function listNames(names){ if(names.length<=2) return names.join(' & '); return names.slice(0,-1).join(', ') + ' & ' + names[names.length-1]; }

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  standings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

/* ---------- Calendar & freshness (same logic as before) ---------- */
function getCurrentWeekInfo(){
  const msPerWeek = 7*24*60*60*1000;
  let w = Math.floor((new Date() - SEASON_WEEK1_START) / msPerWeek) + 1;
  if(w < 1) w = 1; if(w > LAST_WEEK) w = LAST_WEEK;
  return { week:w, isPlayoffs: w > REGULAR_SEASON_WEEKS };
}
function getLatestLoggedWeek(){
  const weeks = (DATA.weeklyScores||[]).map(r=>Number(r.Week)).filter(n=>!isNaN(n));
  return weeks.length ? Math.max(...weeks) : 0;
}
function getDataFreshness(){
  const wk = getCurrentWeekInfo(), latestLogged = getLatestLoggedWeek();
  return { ...wk, latestLogged, isStale: (wk.week - latestLogged) >= 2 };
}

/* ---------- Data -> model ---------- */
function cleanData(){
  if(DATA.teamTotals) DATA.teamTotals = DATA.teamTotals.filter(r => /^t\d+$/.test(r.TeamID));
  if(DATA.standings) DATA.standings = DATA.standings.filter(r => r.Place !== '' && r.Place !== undefined && r.Place !== null);
}

function buildModel(){
  const m = {};
  m.teams = (DATA.teams||[]).filter(t=>t.TeamID);
  m.byId = {}; m.slugOf = {}; m.idOfSlug = {};
  m.teams.forEach(t=>{
    m.byId[t.TeamID] = t;
    let s = slugify(t.TeamName); if(m.idOfSlug[s]) s = s + '-' + t.TeamID;
    m.slugOf[t.TeamID] = s; m.idOfSlug[s] = t.TeamID;
  });
  m.name = id => (m.byId[id] && m.byId[id].TeamName) || id || '—';

  m.hasScores = (DATA.weeklyScores||[]).length > 0;
  const games = {};
  (DATA.weeklyScores||[]).forEach(r=>{ games[r.TeamID] = (games[r.TeamID]||0) + 1; });
  const totalsById = {};
  (DATA.teamTotals||[]).forEach(t=>{ totalsById[t.TeamID] = t; });
  m.totalsById = totalsById;

  m.ranked = m.teams.map(t=>{
    const tot = totalsById[t.TeamID] || {};
    const wins = Number(tot.WeeksWon||0), played = games[t.TeamID]||0;
    return { id:t.TeamID, wins, losses:Math.max(played-wins,0), played, points:Number(tot.SeasonTotalPoints||0), weekly:Number(tot.WeeklyPayoutEarned||0) };
  }).sort((a,b)=> b.wins-a.wins || b.points-a.points);
  m.rankOf = {}; m.ranked.forEach((r,i)=>{ m.rankOf[r.id] = i+1; });
  m.recOf = {}; m.ranked.forEach(r=>{ m.recOf[r.id] = r; });

  const last = m.ranked[m.ranked.length-1];
  m.wheelZone = new Set(m.hasScores && last && m.ranked.length>1 ? m.ranked.filter(t=>t.wins===last.wins && t.points===last.points).map(t=>t.id) : []);

  m.elimWeek = {};
  (DATA.survivor||[]).forEach(s=>{ if(s.eliminatedTeamId) m.elimWeek[s.eliminatedTeamId] = Number(s.week); });
  m.survivorOut = id => (totalsById[id] && totalsById[id].SurvivorEliminated === 'Yes') || (id in m.elimWeek);

  m.fines = (DATA.talbotToll||[]);
  m.finesOwedBy = id => m.fines.filter(f=>f.TeamID===id && f.Paid!=='Yes').reduce((s,f)=>s+Number(f.Amount||0),0);

  m.league = {};
  (DATA.weeklyScores||[]).forEach(r=>{
    const w = Number(r.Week), sc = Number(r.Score);
    if(!w || isNaN(sc)) return;
    (m.league[w] = m.league[w] || {scores:[], decided:false}).scores.push(sc);
    if(isWin(r)) m.league[w].decided = true;
  });
  Object.keys(m.league).forEach(w=>{ m.league[w].median = median(m.league[w].scores); });
  m.decidedWeeks = Object.keys(m.league).map(Number).filter(w=>m.league[w].decided).sort((a,b)=>a-b);
  m.latestDecided = m.decidedWeeks.length ? m.decidedWeeks[m.decidedWeeks.length-1] : 0;

  m.fresh = getDataFreshness();
  m.net = computeNetEarnings(m);
  m.netById = {}; m.net.forEach(n=>{ m.netById[n.id] = n; });
  m.teamRows = id => (DATA.weeklyScores||[]).filter(r=>r.TeamID===id && Number(r.Week) && hasNum(r.Score)).sort((a,b)=>Number(a.Week)-Number(b.Week));
  return m;
}

// Same earnings rules as before, now with the parts exposed for the team page.
function computeNetEarnings(m){
  const totals = (DATA.teamTotals||[]).filter(t=>t.TeamID);
  if(!totals.length) return [];
  const talbotByTeam = {};
  (DATA.talbotToll||[]).forEach(f=>{ talbotByTeam[f.TeamID] = (talbotByTeam[f.TeamID]||0) + Number(f.Amount||0); });
  const standingsByTeam = {};
  (DATA.standings||[]).forEach(s=>{ if(s.TeamID && s.Payout) standingsByTeam[s.TeamID] = (standingsByTeam[s.TeamID]||0) + Number(s.Payout||0); });
  const d = DATA.dashboard || {};
  const seasonConcluded = (DATA.standings||[]).some(s=>s.TeamID);
  const highScoreTeam = (DATA.teams||[]).find(t=>t.TeamName===d.highScoreLeader);
  const survivorTeam = (DATA.teams||[]).find(t=>t.TeamName===d.survivorWinner);
  const wheel = DATA.wheel || {}, spin = wheel.spinResult || {};
  const buyDownTotal = (wheel.punishments||[]).filter(p=>p.BoughtDown==='Yes').reduce((s,p)=>s+Number(p.BuyDownCost||0),0);
  const buyoutTotal = spin.buyoutUsed === 'Yes' ? 150 : 0;
  return totals.map(t=>{
    const weekly = Number(t.WeeklyPayoutEarned||0);
    const high = seasonConcluded && highScoreTeam && t.TeamID===highScoreTeam.TeamID ? 25 : 0;
    const surv = survivorTeam && t.TeamID===survivorTeam.TeamID ? 25 : 0;
    const finish = standingsByTeam[t.TeamID] || 0;
    const earned = weekly + high + surv + finish;
    const tolls = talbotByTeam[t.TeamID] || 0;
    const wheelCost = t.TeamID === spin.teamId ? (buyDownTotal + buyoutTotal) : 0;
    const spent = 150 + tolls + wheelCost;
    const paid = Number(t.AmountPaid||0);
    return { id:t.TeamID, name:m.name(t.TeamID), weekly, high, surv, finish, earned, tolls, wheelCost, spent, net:earned-spent, paid, owed:Math.max(earned-paid,0) };
  });
}

/* ---------- Small UI atoms ---------- */
function hueOf(id){ let h = 7; for(const c of String(id)) h = (h*31 + c.charCodeAt(0)) % 360; return h; }
function initials(name){
  const skip = new Set(['and','the','of','a','to','in','my','wit','it']);
  const words = String(name).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9]/g,'')).filter(Boolean);
  let use = words.filter(w=>!skip.has(w.toLowerCase())); if(use.length < 2) use = words;
  return (use.map(w=>w[0]).slice(0,2).join('') || '?').toUpperCase();
}
const av = (id, size='') => `<span class="av ${size}" style="--h:${hueOf(id)}" aria-hidden="true">${esc(initials(M ? M.name(id) : id))}</span>`;
const teamHref = id => '#/team/' + encodeURIComponent(M.slugOf[id] || id);
const teamLink = id => `<a class="tn" href="${teamHref(id)}">${av(id)}<span>${esc(M.name(id))}</span></a>`;
const chip = (id, cls='') => `<a class="chip ${cls}" href="${teamHref(id)}">${av(id)}${esc(M.name(id))}</a>`;
function statusPill(kind){
  if(kind==='paid') return '<span class="pill p-green">Paid</span>';
  if(kind==='settled') return '<span class="pill p-green">Settled</span>';
  if(kind==='owed') return '<span class="pill p-amber">Owed</span>';
  return '<span class="pill">Pending</span>';
}

/* ---------- Copy with a little attitude ---------- */
function standingQuip(id){
  if(!M.hasScores) return "Nothing logged yet. Everyone is undefeated in spirit.";
  const rk = M.rankOf[id], n = M.ranked.length;
  if(M.wheelZone.has(id)) return "Wheel zone. Sleep with one eye open.";
  if(rk === 1) return "Top of the table. Enjoy the view while it lasts.";
  if(rk <= BYE_SPOTS) return "First-round bye territory. Must be nice.";
  if(rk <= PLAYOFF_SPOTS) return "Inside the playoff line, for now.";
  if(rk === PLAYOFF_SPOTS + 1) return "One spot outside the bracket. Close, which is the worst kind of not good enough.";
  if(rk >= n - 1) return "Closer to the Wheel than the playoffs.";
  return "Outside the playoff line, looking in.";
}
function moneyQuip(id){
  const n = M.netById[id]; if(!n) return '';
  const owedFines = M.finesOwedBy(id);
  if(owedFines > 0) return `You owe the league ${money(owedFines)} in Talbot tolls. The league is patient. The league is also watching.`;
  if(n.owed > 0) return `The league owes you ${money(n.owed)}. Collect it before someone forgets.`;
  if(n.earned > 0) return "All squared up with the league.";
  return "Nothing earned yet. The $150 buy-in is doing a lot of work.";
}

function linkify(text){
  const e = esc(text);
  return e.replace(/(https?:\/\/[^\s]+)/g, url => { const clean = url.replace(/[.,;:)]+$/,''); return `<a href="${clean}" target="_blank" rel="noopener" style="color:var(--violet)">${clean}</a>${url.slice(clean.length)}`; });
}
function wheelSVG(slots){
  const n = Math.max(slots.length, 1), cx = 130, cy = 140, R = 118;
  const cols = ['violet','blue','teal','amber'];
  let g = '';
  for(let i=0;i<n;i++){
    const a0 = (i/n)*2*Math.PI - Math.PI/2, a1 = ((i+1)/n)*2*Math.PI - Math.PI/2, am = (a0+a1)/2;
    const x0 = cx+R*Math.cos(a0), y0 = cy+R*Math.sin(a0), x1 = cx+R*Math.cos(a1), y1 = cy+R*Math.sin(a1);
    const s = slots[i]; const cyoa = s && s.Slot==='CYOA';
    const fill = cyoa ? 'color-mix(in srgb, var(--gold) 38%, var(--surface))' : `color-mix(in srgb, var(--${cols[i%cols.length]}) 26%, var(--surface))`;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    g += n===1 ? `<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:${fill}"/>` : `<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" style="fill:${fill};stroke:var(--surface);stroke-width:2"/>`;
    if(s){
      const tx = cx+R*.7*Math.cos(am), ty = cy+R*.7*Math.sin(am);
      g += `<text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-size="${cyoa?10:13}" font-weight="700" style="fill:var(--ink);font-family:var(--display)">${cyoa?'CYOA':esc(s.Slot)}</text>`;
    }
  }
  return `<svg class="wheel-svg" viewBox="0 0 260 270" role="img" aria-label="Wheel of Misfortune with ${slots.length} slots">
    ${g}<circle cx="${cx}" cy="${cy}" r="16" style="fill:var(--surface);stroke:var(--line-2)"/><circle cx="${cx}" cy="${cy}" r="${R}" style="fill:none;stroke:var(--line-2);stroke-width:1.5"/>
    <path d="M${cx-11} 6L${cx+11} 6L${cx} 28Z" style="fill:var(--ink)"/></svg>`;
}

  <div class="card"><p class="sm soft" style="margin:0">Ten submitted punishments plus a guaranteed CYOA slot. Last place spins. No opt-out, no free pass.</p>
    ${wz.length && !hasSpin ? `<p class="quip" style="color:var(--violet);font-weight:600">On the hook right now: ${esc(listNames(wz.map(id=>M.name(id))))}</p>` : ''}</div>
  <div class="card"><div class="wheel-wrap">${wheelSVG(slots)}<div class="rows">${list || '<p class="empty">Nothing submitted yet.</p>'}</div></div></div>
  <section class="sec"><h2>Spin result</h2><div class="card">${hasSpin ? `
    <div class="mid">${teamLink(spin.teamId)}</div>
    <p class="quip" style="margin-top:8px">${spin.outcome==='cyoa'||spin.outcome==='CYOA' ? 'Landed on CYOA.' : 'Landed on a punishment.'} ${esc(spin.detail||'')}</p>
    <div class="chips" style="margin-top:10px">${spin.buyoutUsed==='Yes'?'<span class="pill p-amber">Buyout used</span>':''}${spin.respinUsed==='Yes'?'<span class="pill p-violet">Respin used</span>':''}</div>` : '<p class="empty">No spin logged yet. The wheel is patient.</p>'}</div></section>`;

/* ---------- Chart ---------- */
function chartSVG(teamId, W){
  const rows = M.teamRows(teamId); if(!rows.length) return '';
  const H = 230, ml = 32, mr = 6, mt = 14, mb = 24, pw = W-ml-mr, ph = H-mt-mb;
  const medians = rows.map(r=>M.league[Number(r.Week)].median);
  const maxVal = Math.max(...rows.map(r=>Number(r.Score)), ...medians, 1);
  const step = maxVal<=100 ? 25 : maxVal<=250 ? 50 : 100;
  const top = Math.ceil(maxVal/step)*step;
  const y = v => mt + ph - (v/top)*ph;
  const slot = pw/rows.length, bw = Math.max(4, Math.min(34, slot*.62));
  let g = '';
  for(let v=0; v<=top; v+=step){
    g += `<line x1="${ml}" x2="${W-mr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)"/><text x="${ml-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--ink-3)">${v}</text>`;
  }
  let bars = '', labels = '', line = [], dots = '';
  rows.forEach((r,i)=>{
    const wk = Number(r.Week), sc = Number(r.Score), lg = M.league[wk], cx = ml + slot*i + slot/2, win = isWin(r);
    const op = win ? 1 : (lg.decided ? .5 : .35);
    bars += `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(sc).toFixed(1)}" width="${bw.toFixed(1)}" height="${((sc/top)*ph).toFixed(1)}" rx="3" style="fill:${win?'var(--green)':'var(--ink-3)'}" opacity="${op}"><title>Week ${wk}: ${sc.toFixed(1)} (${win?'Win':lg.decided?'Loss':'Pending'}), league median ${lg.median.toFixed(1)}</title></rect>`;
    if(slot>=28) labels += `<text x="${cx.toFixed(1)}" y="${(y(sc)-4).toFixed(1)}" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">${Math.round(sc)}</text>`;
    if(slot>=14 || i%2===0) labels += `<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" style="fill:var(--ink-3)">${wk}</text>`;
    line.push(`${cx.toFixed(1)},${y(lg.median).toFixed(1)}`);
    dots += `<circle cx="${cx.toFixed(1)}" cy="${y(lg.median).toFixed(1)}" r="3" style="fill:var(--surface);stroke:var(--gold);stroke-width:1.5"/>`;
  });
  const poly = line.length>1 ? `<polyline points="${line.join(' ')}" fill="none" style="stroke:var(--gold)" stroke-width="1.5" stroke-dasharray="4 3"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly scores for ${esc(M.name(teamId))} compared with the league median" style="display:block">${g}${bars}${poly}${dots}${labels}</svg>`;
}
let lastW = 0, rzTimer = null;
function drawCharts(){
  document.querySelectorAll('.chart-host').forEach(el=>{
    const w = Math.max(260, Math.floor(el.clientWidth || 340)); lastW = w;

  });
}

function parseRoute(){ return location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(s=>{ try{ return decodeURIComponent(s); }catch(e){ return s; } }); }
function routeKey(r){ const k = r[0]; return !k ? 'home' : k==='team' ? 'standings' : (['standings','money','games'].includes(k) ? k : 'home'); }
const TITLES = { home:'Home', standings:'Standings', money:'Money', games:'Side games' };
let lastRouteSig = null;

function render(){
  const main = $('#main');
  const route = parseRoute();
  renderChrome();
  if(!DATA){
    main.innerHTML = loadFailed ? `<div class="error"><p>Could not load league data right now.</p><button class="btn solid" data-action="retry">Try again</button></div>` : skeleton();
    return;
  }
  let html, title;
  const k = route[0];
  if(k==='team'){ html = renderTeam(route[1]||''); const id = M.idOfSlug[route[1]]; title = id ? M.name(id) : 'Team'; }
  else if(k==='standings'){ html = renderStandings(); title = 'Standings'; }
  else if(k==='money'){ html = renderMoney(route[1]); title = 'Money'; }
  else if(k==='games'){ html = renderGames(route[1]); title = 'Side games'; }
  else { html = renderHome(); title = 'Home'; }
  main.innerHTML = html + footerHTML();
  document.title = title + ' · Huck It Chuck It Football';
  drawCharts();
  const sig = route.join('/');
  if(sig !== lastRouteSig){ window.scrollTo(0,0); lastRouteSig = sig; }
}
window.addEventListener('hashchange', ()=>{ render(); const m = $('#main'); if(m) m.focus({preventScroll:true}); });

/* ---------- Team picker ---------- */
function openPicker(){
  if(!M) return;
  const dlg = $('#picker');
  dlg.innerHTML = `<div class="sheet"><h2>Which team is yours?</h2>
    <p>We'll remember it on this device. No login, no account.</p>
    <div class="pick-list">${M.teams.map(t=>`<button type="button" class="pick${t.TeamID===myTeamId?' on':''}" data-action="set-team" data-team="${esc(t.TeamID)}">${av(t.TeamID)}<span><b>${esc(t.TeamName)}</b><small>${esc(t.Owner||'')}</small></span></button>`).join('')}</div>
    <div class="sheet-actions">${myTeamId?'<button type="button" class="btn" data-action="clear-team">Clear</button>':''}<button type="button" class="btn" data-action="skip">${myTeamId?'Cancel':'Not now'}</button></div></div>`;
  if(!dlg.open) dlg.showModal();
}
function closePicker(){ const dlg = $('#picker'); if(dlg.open) dlg.close(); }
$('#picker').addEventListener('click', e=>{ if(e.target === e.currentTarget) closePicker(); });

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action;
  if(a==='pick-team') openPicker();
  else if(a==='set-team'){ myTeamId = el.dataset.team; store.set(KEY.team, myTeamId); closePicker(); render(); }
  else if(a==='clear-team'){ myTeamId = null; store.del(KEY.team); closePicker(); render(); }
  else if(a==='skip'){ store.set(KEY.skip,'1'); closePicker(); }
  else if(a==='theme') toggleTheme();
  else if(a==='retry'){ loadFailed = false; render(); load(); }
});

/* ---------- Load (show saved copy instantly, refresh in background) ---------- */
function ingest(json, ts, cached){
  DATA = json; cleanData(); M = buildModel(); fetchedAt = ts; fromCache = cached;
  if(myTeamId && !M.byId[myTeamId]){ myTeamId = null; store.del(KEY.team); }
}
function maybePrompt(){
  const r = parseRoute();
  if(M && !myTeamId && !store.get(KEY.skip) && r[0] !== 'team' && M.teams.length) openPicker();
}
async function load(){
  let hadCache = false;
  try{
    const raw = store.get(KEY.data);
    if(raw){ const c = JSON.parse(raw); if(c && c.data){ ingest(c.data, c.ts, true); hadCache = true; render(); maybePrompt(); } }
  }catch(e){}
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('Request failed');
    const json = await res.json();
    const ts = Date.now();
    ingest(json, ts, false); loadFailed = false;
    store.set(KEY.data, JSON.stringify({ ts, data: json }));
    render(); if(!hadCache) maybePrompt();
  }catch(e){
    loadFailed = true; render();
  }
}
render();
load();
</script>
</body>
