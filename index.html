<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huck It Chuck It Football — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --bg-elev:#FFFFFF;
    --text:#15171B;
    --text-soft:#5B6169;
    --text-muted:#686E76;
    --border:rgba(21,23,27,0.10);
    --border-strong:rgba(21,23,27,0.20);
    --green:#1E7D53; --green-bg:rgba(30,125,83,0.10);
    --amber:#B5490C; --amber-bg:rgba(181,73,12,0.10);
    --blue:#2158B0; --blue-bg:rgba(33,88,176,0.10);
    --violet:#6B3FB5; --violet-bg:rgba(107,63,181,0.10);
    --teal:#0E7A70; --teal-bg:rgba(14,122,112,0.10);
    --gold:#8A6B12; --gold-bg:rgba(154,123,18,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --bg:#15171B;
      --bg-elev:#1D2025;
      --text:#EDEDEB;
      --text-soft:#A0A6AD;
      --text-muted:#8B9299;
      --border:rgba(255,255,255,0.09);
      --border-strong:rgba(255,255,255,0.18);
      --green:#6FCF97; --green-bg:rgba(111,207,151,0.14);
      --amber:#E8875B; --amber-bg:rgba(232,135,91,0.14);
      --blue:#7FB2FF; --blue-bg:rgba(127,178,255,0.14);
      --violet:#B79CE8; --violet-bg:rgba(183,156,232,0.14);
      --teal:#5EEAD4; --teal-bg:rgba(94,234,212,0.14);
      --gold:#E4C368; --gold-bg:rgba(228,195,104,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171B;
    --bg-elev:#1D2025;
    --text:#EDEDEB;
    --text-soft:#A0A6AD;
    --text-muted:#8B9299;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --green:#6FCF97; --green-bg:rgba(111,207,151,0.14);
    --amber:#E8875B; --amber-bg:rgba(232,135,91,0.14);
    --blue:#7FB2FF; --blue-bg:rgba(127,178,255,0.14);
    --violet:#B79CE8; --violet-bg:rgba(183,156,232,0.14);
    --teal:#5EEAD4; --teal-bg:rgba(94,234,212,0.14);
    --gold:#E4C368; --gold-bg:rgba(228,195,104,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;font-weight:600;margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  /* Focus states for keyboard navigation */
  .navbtn:focus-visible, .link-btn:focus-visible, a:focus-visible, button:focus-visible{
    outline:2px solid var(--text);
    outline-offset:2px;
    border-radius:4px;
  }

  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{font-size:clamp(20px,4vw,26px);}
  .badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .badge{
    background:var(--gold-bg);
    color:var(--gold);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .badge-neutral{
    background:var(--border);
    color:var(--text-soft);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .badge-warning{
    background:var(--amber-bg);
    color:var(--amber);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .theme-toggle{
    display:flex;
    gap:2px;
    background:var(--border);
    padding:3px;
    border-radius:20px;
  }
  .theme-btn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    border-radius:16px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .theme-btn svg{width:14px;height:14px;}
  .theme-btn.active{background:var(--bg-elev);color:var(--text);}
  .theme-btn:hover:not(.active){color:var(--text-soft);}
  .link-row{display:flex;gap:8px;flex-wrap:wrap;}
  .link-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:20px;
    text-decoration:none;
    cursor:pointer;
  }
  .link-btn:hover{background:var(--bg-elev);}
  .link-btn svg{width:12px;height:12px;flex:0 0 auto;}

  .team-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .team-chip{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    padding:6px 12px;
    border-radius:8px;
  }

  .nav-wrap{position:relative;border-bottom:1px solid var(--border);}
  nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:10px 16px 0;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .nav-fade{
    position:absolute;
    top:0;
    bottom:1px;
    width:28px;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .nav-fade.visible{opacity:1;}
  .nav-fade-left{left:0;background:linear-gradient(90deg, var(--bg) 0%, transparent 100%);}
  .nav-fade-right{right:0;background:linear-gradient(270deg, var(--bg) 0%, transparent 100%);}
  .navbtn{
    flex:0 0 auto;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--text-soft);
    padding:10px 14px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .navbtn.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{max-width:900px;margin:0 auto;padding:24px 18px 70px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade 0.15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  .section-title{font-size:20px;margin-bottom:4px;}
  .section-title.with-accent{border-left:3px solid var(--accent, var(--text));padding-left:12px;}
  .section-sub{color:var(--text-soft);font-size:13.5px;margin:0 0 18px;}

  .subgroup-title{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    font-weight:600;
    margin:24px 0 10px;
  }
  .subgroup-title:first-of-type{margin-top:20px;}

  .card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .card h3{font-size:14px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.04em;font-family:'Inter',sans-serif;font-weight:600;margin-bottom:12px;}

  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:4px;}
  @media (min-width:520px){
    .metric-grid{grid-template-columns:repeat(3,1fr);}
  }
  .metric{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .metric .v{font-family:'Sora',sans-serif;font-size:22px;font-weight:600;display:block;}
  .metric .l{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:4px;align-items:start;}
  .feature-card{margin-bottom:0;}
  .feature-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;margin-bottom:8px;}
  .feature-value{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.3;}
  .feature-sub{font-size:12.5px;color:var(--text-soft);margin-top:4px;}

  table{width:100%;min-width:460px;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background-color 0.1s ease;}
  tbody tr:hover{background-color:var(--border);}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .empty{color:var(--text-muted);font-size:13.5px;font-style:italic;padding:12px 0;margin:0;}
  .tag-green{background:var(--green-bg);color:var(--green);}
  .tag-amber{background:var(--amber-bg);color:var(--amber);}
  .tag-blue{background:var(--blue-bg);color:var(--blue);}
  .tag-violet{background:var(--violet-bg);color:var(--violet);}
  .tag-teal{background:var(--teal-bg);color:var(--teal);}
  .tag-gold{background:var(--gold-bg);color:var(--gold);}

  .loading{padding:70px 20px;text-align:center;color:var(--text-soft);}
  .spinner{
    width:26px;height:26px;
    border:3px solid var(--border-strong);
    border-top-color:var(--text-soft);
    border-radius:50%;
    margin:0 auto 14px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-msg{padding:60px 20px;text-align:center;}
  .error-msg p{color:var(--amber);margin:0 0 14px;}

  .lead-name{font-family:'Sora',sans-serif;font-weight:600;}
  .accent-green{color:var(--green);}
  .accent-amber{color:var(--amber);}
  .accent-blue{color:var(--blue);}
  .accent-violet{color:var(--violet);}
  .accent-teal{color:var(--teal);}
  .accent-gold{color:var(--gold);}
</style>
</head>
<body>

<header>
  <h1>Huck It Chuck It Football</h1>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
    <div class="theme-toggle" id="theme-toggle"></div>
    <div class="badges" id="header-badges">
      <span class="badge-neutral">Loading…</span>
    </div>
    <div class="link-row">
      <a class="link-btn" href="https://football.fantasysports.yahoo.com/f1/916694" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        Yahoo league
      </a>
      <a class="link-btn" href="https://drive.google.com/file/d/11PVaaci91UFUF4hIhSQbyyXEigXacpQV/view?usp=sharing" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        League rules
      </a>
    </div>
  </div>
</header>

<div class="nav-wrap">
  <nav id="tabs"></nav>
  <div class="nav-fade nav-fade-left" id="nav-fade-left"></div>
  <div class="nav-fade nav-fade-right" id="nav-fade-right"></div>
</div>
<main id="main"><div class="loading"><div class="spinner"></div><p>Loading league data…</p></div></main>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWtG0XWPUbC7nZpgRDntfXKofSJaysxnKWcYgoAjcAiBOg-CUFexBDH7ZdwI1Xa9Y/exec";

const TABS = [
  {id:'overview', label:'Overview', accent:'--text'},
  {id:'payouts', label:'Payouts', accent:'--green'},
  {id:'talbot', label:'Talbot toll', accent:'--amber'},
  {id:'survivor', label:'Survivor', accent:'--blue'},
  {id:'wheel', label:'Wheel', accent:'--violet'},
  {id:'charity', label:'Charity', accent:'--teal'},
  {id:'standings', label:'Standings', accent:'--gold'},
  {id:'teams', label:'Teams', accent:'--text'}
];

let DATA = null;
let activeTab = 'overview';
let themeMode = 'system'; // 'system' | 'light' | 'dark'

const THEME_ICONS = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
};

function applyTheme(){
  if(themeMode === 'system'){
    document.documentElement.removeAttribute('data-theme');
  }else{
    document.documentElement.setAttribute('data-theme', themeMode);
  }
  renderThemeToggle();
}

function renderThemeToggle(){
  const el = document.getElementById('theme-toggle');
  if(!el) return;
  el.innerHTML = ['light','system','dark'].map(mode=>
    `<button class="theme-btn${themeMode===mode?' active':''}" data-mode="${mode}" aria-label="${mode} mode" title="${mode.charAt(0).toUpperCase()+mode.slice(1)} mode">${THEME_ICONS[mode]}</button>`
  ).join('');
  el.querySelectorAll('.theme-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ themeMode = b.dataset.mode; applyTheme(); });
  });
}

applyTheme();

function fmt(n){
  const num = Number(n);
  if(isNaN(num)) return '$0';
  return '$' + Math.round(num).toLocaleString();
}
function pts(n){
  const num = Number(n);
  if(isNaN(num)) return '0.0';
  return num.toFixed(1);
}
function fmtSigned(n){
  const num = Math.round(Number(n)||0);
  const sign = num < 0 ? '-' : '+';
  return sign + '$' + Math.abs(num).toLocaleString();
}
function formatTiedNames(names){
  if(names.length <= 2) return names.join(' & ');
  return `${names.length} teams tied`;
}

async function load(){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('Request failed');
    DATA = await res.json();
    cleanData();
    renderHeader();
    renderTabs();
    renderMain();
  }catch(e){
    document.getElementById('main').innerHTML = `
      <div class="error-msg">
        <p>Could not load league data right now.</p>
        <button class="link-btn" onclick="location.reload()">Try again</button>
      </div>
    `;
    document.getElementById('header-badges').innerHTML = '';
  }
}

function cleanData(){
  if(DATA.teamTotals){
    DATA.teamTotals = DATA.teamTotals.filter(r => /^t\d+$/.test(r.TeamID));
  }
  if(DATA.standings){
    DATA.standings = DATA.standings.filter(r => r.Place !== '' && r.Place !== undefined && r.Place !== null);
  }
}

function teamName(id){
  const t = (DATA.teams||[]).find(x=>x.TeamID===id);
  return t ? t.TeamName : (id || '—');
}

// Week 1 begins the Tuesday before the 2026 season's Wednesday opener (Sep 9).
// Each subsequent week is a standard Tuesday-to-Monday NFL week. Weeks 1-14 are
// the regular season for this league; weeks 15-17 are the 3-round playoffs.
const SEASON_WEEK1_START = new Date(2026, 8, 8); // Sep 8, 2026 (month is 0-indexed)
const REGULAR_SEASON_WEEKS = 14;
const LAST_WEEK = 17;

function getCurrentWeekInfo(){
  const now = new Date();
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  let weekNum = Math.floor((now - SEASON_WEEK1_START) / msPerWeek) + 1;
  if(weekNum < 1) weekNum = 1;
  if(weekNum > LAST_WEEK) weekNum = LAST_WEEK;
  const isPlayoffs = weekNum > REGULAR_SEASON_WEEKS;
  return { week: weekNum, isPlayoffs };
}

function getLatestLoggedWeek(){
  const weeks = (DATA.weeklyScores||[]).map(r=>Number(r.Week)).filter(n=>!isNaN(n));
  return weeks.length ? Math.max(...weeks) : 0;
}

// "Stale" means the Sheet is missing at least one full week of scores relative
// to the calendar -- being one week behind is normal (this week isn't over yet).
function getDataFreshness(){
  const wk = getCurrentWeekInfo();
  const latestLogged = getLatestLoggedWeek();
  const weeksBehind = wk.week - latestLogged;
  return { ...wk, latestLogged, weeksBehind, isStale: weeksBehind >= 2 };
}

function renderHeader(){
  const d = DATA.dashboard || {};
  const fresh = getDataFreshness();
  const weekLabel = fresh.isPlayoffs ? `Playoffs · Wk ${fresh.week}` : `Week ${fresh.week}`;
  document.getElementById('header-badges').innerHTML = `
    <span class="badge-neutral">${weekLabel}</span>
    ${fresh.isStale ? `<span class="badge-warning">Data from Wk ${fresh.latestLogged}</span>` : ''}
    <span class="badge">Pot ${fmt(d.totalPot)}</span>
    <span class="badge">Charity ${fmt(d.charityRaised)}</span>
  `;
}

function updateNavFades(){
  const el = document.getElementById('tabs');
  const left = document.getElementById('nav-fade-left');
  const right = document.getElementById('nav-fade-right');
  if(!el || !left || !right) return;
  const maxScroll = el.scrollWidth - el.clientWidth;
  left.classList.toggle('visible', el.scrollLeft > 4);
  right.classList.toggle('visible', el.scrollLeft < maxScroll - 4);
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t=>`<button class="navbtn${t.id===activeTab?' active':''}" data-tab="${t.id}" style="--accent:var(${t.accent})">${t.label}</button>`).join('');
  el.querySelectorAll('.navbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeTab=b.dataset.tab;
      renderTabs();
      renderMain();
    });
  });
  el.removeEventListener('scroll', updateNavFades);
  el.addEventListener('scroll', updateNavFades);
  // Keep the active tab in view, and let layout settle before measuring fades.
  const activeBtn = el.querySelector('.navbtn.active');
  if(activeBtn) activeBtn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  setTimeout(updateNavFades, 0);
}
window.addEventListener('resize', updateNavFades);

function renderMain(){
  const el = document.getElementById('main');
  const renderers = {
    overview: renderOverview, payouts: renderPayouts, talbot: renderTalbot,
    survivor: renderSurvivor, wheel: renderWheel, charity: renderCharity,
    standings: renderStandings, teams: renderTeams
  };
  el.innerHTML = renderers[activeTab]();
}

// Consistent title helper: category-colored left accent, used on every tab except Overview/Teams.
function titleWithAccent(text, cssVar){
  return `<h2 class="section-title with-accent" style="--accent:var(${cssVar});">${text}</h2>`;
}

// ---------- OVERVIEW ----------
function computeLastPlace(){
  const totals = (DATA.teamTotals||[]).filter(t => t.TeamID);
  if(!totals.length) return null;
  const min = Math.min(...totals.map(t=>Number(t.SeasonTotalPoints||0)));
  const teams = totals.filter(t=>Number(t.SeasonTotalPoints||0)===min).map(t=>teamName(t.TeamID));
  return {min, teams};
}

function computeNetEarnings(){
  const totals = (DATA.teamTotals||[]).filter(t=>t.TeamID);
  if(!totals.length) return [];

  const talbotByTeam = {};
  (DATA.talbotToll||[]).forEach(f=>{
    talbotByTeam[f.TeamID] = (talbotByTeam[f.TeamID]||0) + Number(f.Amount||0);
  });

  const standingsByTeam = {};
  (DATA.standings||[]).forEach(s=>{
    if(s.TeamID && s.Payout) standingsByTeam[s.TeamID] = (standingsByTeam[s.TeamID]||0) + Number(s.Payout||0);
  });

  const d = DATA.dashboard || {};
  const seasonConcluded = (DATA.standings||[]).some(s => s.TeamID);
  const highScoreTeam = (DATA.teams||[]).find(t=>t.TeamName===d.highScoreLeader);
  const survivorTeam = (DATA.teams||[]).find(t=>t.TeamName===d.survivorWinner);
  const wheel = DATA.wheel || {};
  const spin = wheel.spinResult || {};
  const buyDownTotal = (wheel.punishments||[]).filter(p=>p.BoughtDown==='Yes').reduce((s,p)=>s+Number(p.BuyDownCost||0),0);
  const buyoutTotal = spin.buyoutUsed === 'Yes' ? 150 : 0;

  return totals.map(t=>{
    const earned = Number(t.WeeklyPayoutEarned||0)
      + (seasonConcluded && highScoreTeam && t.TeamID===highScoreTeam.TeamID ? 25 : 0)
      + (survivorTeam && t.TeamID===survivorTeam.TeamID ? 25 : 0)
      + (standingsByTeam[t.TeamID] || 0);
    const spent = 150
      + (talbotByTeam[t.TeamID] || 0)
      + (t.TeamID === spin.teamId ? (buyDownTotal + buyoutTotal) : 0);
    const paid = Number(t.AmountPaid || 0);
    const owed = Math.max(earned - paid, 0);
    return { teamId: t.TeamID, name: teamName(t.TeamID), earned, spent, net: earned - spent, paid, owed };
  });
}

function renderOverview(){
  const d = DATA.dashboard || {};
  const hasScores = d.highScoreLeader && Number(d.highScoreTotal) > 0;
  const survivorAlive = (DATA.teamTotals||[]).filter(t=>t.SurvivorEliminated==='No').map(t=>teamName(t.TeamID)).sort();
  const lastPlace = hasScores ? computeLastPlace() : null;
  const talbotCollected = (DATA.talbotToll||[]).filter(f=>f.Paid==='Yes').reduce((s,f)=>s+Number(f.Amount||0),0);
  const netEarnings = computeNetEarnings().sort((a,b)=>b.net-a.net);
  const prizeOutstanding = netEarnings.reduce((s,t)=>s+t.owed, 0);
  const bestNetValue = netEarnings.length ? netEarnings[0].net : null;
  const worstNetValue = netEarnings.length ? netEarnings[netEarnings.length-1].net : null;
  const bestNetTeams = netEarnings.filter(t=>t.net===bestNetValue).map(t=>t.name);
  const worstNetTeams = netEarnings.filter(t=>t.net===worstNetValue).map(t=>t.name);
  const hasNetSpread = bestNetValue !== null && worstNetValue !== null && bestNetValue !== worstNetValue;
  const fresh = getDataFreshness();

  return `
  <h2 class="section-title" style="margin-bottom:18px;">Season at a glance</h2>

  ${fresh.isStale ? `<div class="banner-note">${fresh.isPlayoffs ? 'Playoffs ' : ''}Week ${fresh.week} has started, but the most recent scores logged are from Week ${fresh.latestLogged}. Add Week ${fresh.latestLogged + 1} scores in the Sheet to catch this up.</div>` : ''}

  <div class="metric-grid">
    <div class="metric"><span class="v accent-green">${fmt(d.weeklyPayoutsToDate)}</span><span class="l">Weekly payouts to date</span></div>
    <div class="metric"><span class="v accent-amber">${fmt(talbotCollected)}</span><span class="l">Talbot tolls collected</span></div>
    <div class="metric"><span class="v accent-blue">${d.survivorRemaining ?? '—'}</span><span class="l">Survivor teams remaining</span></div>
    <div class="metric"><span class="v accent-teal">${fmt(d.charityRaised)}</span><span class="l">Charity raised</span></div>
    <div class="metric"><span class="v accent-gold">${fmt(prizeOutstanding)}</span><span class="l">Prize money outstanding</span></div>
  </div>

  <div class="subgroup-title">Points race</div>
  <div class="feature-grid">
    <div class="card feature-card">
      <div class="feature-label">Highest score race</div>
      ${hasScores
        ? `<div class="feature-value">${d.highScoreLeader}</div><div class="feature-sub">${pts(d.highScoreTotal)} points this season</div>`
        : `<p class="empty">No scores logged yet.</p>`}
    </div>
    <div class="card feature-card">
      <div class="feature-label" style="color:var(--violet);">Wheel of misfortune watch</div>
      ${lastPlace
        ? `<div class="feature-value">${formatTiedNames(lastPlace.teams)}</div><div class="feature-sub">${pts(lastPlace.min)} points — currently ${lastPlace.teams.length>1?'tied for ':''}last</div>`
        : `<p class="empty">No scores logged yet.</p>`}
    </div>
  </div>

  <div class="subgroup-title">Money</div>
  <div class="card">
    <h3>Net earnings</h3>
    ${hasNetSpread ? `
      <div style="display:flex;gap:24px;flex-wrap:wrap;">
        <div>
          <div class="feature-label" style="color:var(--green);">Highest</div>
          <div class="feature-value">${formatTiedNames(bestNetTeams)}</div>
          <div class="feature-sub" style="color:var(--green);font-weight:600;">${fmtSigned(bestNetValue)}</div>
        </div>
        <div>
          <div class="feature-label" style="color:var(--amber);">Lowest</div>
          <div class="feature-value">${formatTiedNames(worstNetTeams)}</div>
          <div class="feature-sub" style="color:var(--amber);font-weight:600;">${fmtSigned(worstNetValue)}</div>
        </div>
      </div>
    ` : `<p class="empty">Everyone's even so far.</p>`}
  </div>

  <div class="subgroup-title">Pools</div>
  <div class="card">
    <h3>Survivor pool — still alive</h3>
    ${survivorAlive.length ? `<div class="team-grid">${survivorAlive.map(n=>`<span class="team-chip">${n}</span>`).join('')}</div>`
      : `<p class="empty">No data yet.</p>`}
    ${d.survivorWinner ? `<p style="margin:12px 0 0;font-family:'Sora',sans-serif;font-weight:600;color:var(--blue);">${d.survivorWinner} wins Survivor</p>` : ''}
  </div>
  `;
}

// ---------- PAYOUTS ----------
function renderPayouts(){
  const gamesByTeam = {};
  (DATA.weeklyScores||[]).forEach(row=>{
    gamesByTeam[row.TeamID] = (gamesByTeam[row.TeamID]||0) + 1;
  });
  const totals = (DATA.teamTotals||[]).slice().sort((a,b)=>{
    const winsA = Number(a.WeeksWon||0), winsB = Number(b.WeeksWon||0);
    if(winsB !== winsA) return winsB - winsA;
    return Number(b.SeasonTotalPoints||0) - Number(a.SeasonTotalPoints||0);
  });
  const rows = totals.map(t=>{
    const wins = Number(t.WeeksWon||0);
    const played = gamesByTeam[t.TeamID] || 0;
    const losses = Math.max(played - wins, 0);
    return `
    <tr>
      <td>${teamName(t.TeamID)}</td>
      <td class="num-cell">${wins}-${losses}</td>
      <td class="num-cell">${pts(t.SeasonTotalPoints)}</td>
      <td class="num-cell">${fmt(t.WeeklyPayoutEarned)}</td>
    </tr>
  `;
  }).join('');

  const weeks = {};
  (DATA.weeklyScores||[]).forEach(row=>{
    if(row.Won === 'Yes' || row.Won === true){
      weeks[row.Week] = weeks[row.Week] || [];
      weeks[row.Week].push(teamName(row.TeamID));
    }
  });
  const weekRows = Object.keys(weeks).map(Number).sort((a,b)=>a-b).map(w=>`
    <tr><td>Week ${w}</td><td>${weeks[w].join(', ')}</td><td class="num-cell">${fmt(weeks[w].length*10)}</td></tr>
  `).join('');

  const netRows = computeNetEarnings().sort((a,b)=>b.net-a.net).map(t=>`
    <tr>
      <td>${t.name}</td>
      <td class="num-cell">${fmt(t.earned)}</td>
      <td class="num-cell">${fmt(t.spent)}</td>
      <td class="num-cell" style="font-weight:600;color:${t.net>=0?'var(--green)':'var(--amber)'};">${fmtSigned(t.net)}</td>
      <td class="num-cell">${fmt(t.paid)}</td>
      <td class="num-cell" style="${t.owed>0?'color:var(--amber);font-weight:600;':''}">${t.owed>0?fmt(t.owed):'Settled'}</td>
    </tr>
  `).join('');

  return `
  ${titleWithAccent('Weekly payouts', '--green')}
  <p class="section-sub">$10 to each winning team, per week of the regular season.</p>

  <div class="card">
    <h3>Team records</h3>
    <p class="section-sub" style="margin-bottom:12px;">Sorted by record, then points as a tiebreaker. This is a running tally from the Sheet, not the official Yahoo standings used for playoff seeding.</p>
    ${rows ? `<table><thead><tr><th>Team</th><th class="num-cell">Record</th><th class="num-cell">Points</th><th class="num-cell">Earned</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">No scores logged yet.</p>`}
  </div>

  <div class="card">
    <h3>Week-by-week winners</h3>
    ${weekRows ? `<table><thead><tr><th>Week</th><th>Winners</th><th class="num-cell">Paid out</th></tr></thead><tbody>${weekRows}</tbody></table>`
      : `<p class="empty">No weeks logged yet.</p>`}
  </div>

  <div class="card">
    <h3>Net earnings by team</h3>
    <p class="section-sub" style="margin-bottom:12px;">Earned = weekly payouts + Highest Score + Survivor + final standings, once each is determined. Spent = $150 entry fee + Talbot Toll fines + wheel buy-downs/buyout (only for the season's last-place team, once logged). Paid/Still owed tracks actual prize money sent, separate from what's owed to the league.</p>
    ${netRows ? `<table><thead><tr><th>Team</th><th class="num-cell">Earned</th><th class="num-cell">Spent</th><th class="num-cell">Net</th><th class="num-cell">Paid</th><th class="num-cell">Still owed</th></tr></thead><tbody>${netRows}</tbody></table>`
      : `<p class="empty">No data yet.</p>`}
  </div>
  `;
}

// ---------- TALBOT ----------
function renderTalbot(){
  const fines = (DATA.talbotToll||[]).slice().reverse();
  const rows = fines.map(f=>`
    <tr>
      <td>Week ${f.Week}</td>
      <td>${teamName(f.TeamID)}</td>
      <td class="num-cell">${fmt(f.Amount)}</td>
      <td style="text-align:center;"><span class="pill ${f.Paid==='Yes'?'tag-green':'tag-amber'}">${f.Paid==='Yes'?'Paid':'Owed'}</span></td>
    </tr>
  `).join('');

  const owed = (DATA.talbotToll||[]).filter(f=>f.Paid!=='Yes').reduce((s,f)=>s+Number(f.Amount||0),0);
  const collected = (DATA.talbotToll||[]).filter(f=>f.Paid==='Yes').reduce((s,f)=>s+Number(f.Amount||0),0);

  return `
  ${titleWithAccent('The Talbot toll', '--amber')}
  <p class="section-sub">$5 for the first offense, doubling every offense after, per inactive player started.</p>

  <div class="metric-grid">
    <div class="metric"><span class="v accent-amber">${fmt(owed)}</span><span class="l">Currently owed</span></div>
    <div class="metric"><span class="v accent-green">${fmt(collected)}</span><span class="l">Collected this season</span></div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Fine log</h3>
    ${rows ? `<table><thead><tr><th>Week</th><th>Team</th><th class="num-cell">Amount</th><th style="text-align:center;">Status</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">No fines logged yet.</p>`}
  </div>
  `;
}

// ---------- SURVIVOR ----------
function renderSurvivor(){
  const s = DATA.survivor || [];
  const rows = s.map(w=>`
    <tr>
      <td>Week ${w.week}</td>
      <td class="num-cell">${w.lowestScore !== '' && w.lowestScore != null ? pts(w.lowestScore) : '—'}</td>
      <td>${w.eliminatedTeamId ? teamName(w.eliminatedTeamId) : '—'}</td>
    </tr>
  `).join('');

  const totals = DATA.teamTotals || [];
  const alive = totals.filter(t=>t.SurvivorEliminated==='No').map(t=>teamName(t.TeamID)).sort();
  const eliminated = totals.filter(t=>t.SurvivorEliminated==='Yes').map(t=>teamName(t.TeamID)).sort();
  const d = DATA.dashboard || {};

  return `
  ${titleWithAccent('Survivor pool', '--blue')}
  <p class="section-sub">Lowest score each week is out, starting Week 1. Last team standing at Week 10 wins.</p>

  <div class="card">
    <h3>Still alive (${d.survivorRemaining ?? alive.length})</h3>
    ${alive.length ? `<div class="team-grid">${alive.map(n=>`<span class="team-chip">${n}</span>`).join('')}</div>` : `<p class="empty">No data yet.</p>`}
    ${d.survivorWinner ? `<p style="margin:12px 0 0;font-family:'Sora',sans-serif;font-weight:600;color:var(--blue);">${d.survivorWinner} wins Survivor</p>` : ''}
  </div>

  ${eliminated.length ? `<div class="card"><h3>Eliminated</h3><div class="team-grid">${eliminated.map(n=>`<span class="team-chip">${n}</span>`).join('')}</div></div>` : ''}

  <div class="card">
    <h3>Week-by-week</h3>
    ${rows ? `<table><thead><tr><th>Week</th><th class="num-cell">Lowest score</th><th>Eliminated</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">No weeks logged yet.</p>`}
  </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text){
  if(!text) return '';
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s]+)/g, url => {
    const clean = url.replace(/[.,;:)]+$/, '');
    const trailing = url.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener" style="color:var(--violet);">${clean}</a>${trailing}`;
  });
}

// ---------- WHEEL ----------
function renderWheel(){
  const wheel = DATA.wheel || {};
  const punishments = (wheel.punishments||[]).filter(p=>typeof p.Slot === 'number' || p.Slot === 'CYOA');
  const rows = punishments.map(p=>`
    <tr>
      <td>${p.SubmittedBy ? teamName(p.SubmittedBy) : '—'}</td>
      <td>${p.PunishmentText ? linkify(p.PunishmentText) : '<span class="empty" style="padding:0;">Not submitted yet</span>'}</td>
      <td style="text-align:center;">${p.BoughtDown==='Yes' ? `<span class="pill tag-amber">Bought down${p.BuyDownCost?' — '+fmt(p.BuyDownCost):''}</span>` : (p.BoughtDown==='N/A' ? '<span class="pill tag-violet">Always in</span>' : '—')}</td>
    </tr>
  `).join('');

  const spin = wheel.spinResult || {};
  const hasSpin = spin.teamId && spin.teamId !== '';

  return `
  ${titleWithAccent('Wheel of misfortune', '--violet')}
  <p class="section-sub">10 submitted punishments plus a guaranteed CYOA slot — no opt-out, no free pass.</p>

  <div class="card">
    <h3>Punishment list</h3>
    ${rows ? `<table><thead><tr><th>Submitted by</th><th>Punishment</th><th style="text-align:center;">Status</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">Nothing submitted yet.</p>`}
  </div>

  <div class="card">
    <h3>Spin result</h3>
    ${hasSpin ? `
      <p style="margin:0 0 6px;"><span class="lead-name">${teamName(spin.teamId)}</span> — ${spin.outcome === 'cyoa' || spin.outcome === 'CYOA' ? 'landed on CYOA' : 'landed on a punishment'}</p>
      <p style="margin:0;color:var(--text-soft);">${spin.detail || ''}</p>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        ${spin.buyoutUsed==='Yes' ? '<span class="pill tag-amber">Buyout used</span>' : ''}
        ${spin.respinUsed==='Yes' ? '<span class="pill tag-violet">Respin used</span>' : ''}
      </div>
    ` : `<p class="empty">No spin logged yet.</p>`}
  </div>
  `;
}

// ---------- CHARITY ----------
function renderCharity(){
  const c = DATA.charity || {};
  const rows = (c.donations||[]).slice().reverse().map(d=>`
    <tr><td>${d.Date || ''}</td><td>${d.Source || ''}</td><td class="num-cell">${fmt(d.Amount)}</td><td>${d.Note || ''}</td></tr>
  `).join('');

  return `
  ${titleWithAccent('Charity ledger', '--teal')}
  <p class="section-sub">Buy-down fees, punishment buyouts, and leftover Talbot toll all route here instead of to any league member.</p>

  <div class="card">
    <h3>Selected charity</h3>
    <p style="margin:0;">${c.name || 'Not selected yet'}${c.selectedBy ? ` — chosen by ${c.selectedBy}` : ''}</p>
  </div>

  <div class="card">
    <h3>Donation log — ${fmt(c.total)} total</h3>
    ${rows ? `<table><thead><tr><th>Date</th><th>Source</th><th class="num-cell">Amount</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">No donations logged yet.</p>`}
  </div>
  `;
}

// ---------- STANDINGS ----------
function renderStandings(){
  const rows = (DATA.standings||[]).map(s=>`
    <tr>
      <td>${s.Place}</td>
      <td>${s.TeamID ? teamName(s.TeamID) : '—'}</td>
      <td class="num-cell">${fmt(s.Payout)}</td>
    </tr>
  `).join('');

  return `
  ${titleWithAccent('Final standings', '--gold')}
  <p class="section-sub">Set once the championship wraps.</p>

  <div class="card">
    ${rows ? `<table><thead><tr><th>Place</th><th>Team</th><th class="num-cell">Payout</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="empty">Final standings not set yet.</p>`}
  </div>
  `;
}

// ---------- TEAMS ----------
function renderTeams(){
  const rows = (DATA.teams||[]).map(t=>`<tr><td>${t.TeamName}</td><td>${t.Owner || '—'}</td></tr>`).join('');
  return `
  <h2 class="section-title">Teams</h2>
  <p class="section-sub">Roster of teams and owners for the season.</p>
  <div class="card">
    <table><thead><tr><th>Team</th><th>Owner</th></tr></thead><tbody>${rows}</tbody></table>
  </div>
  `;
}

load();
</script>
</body>
</html>
